[workspace]
resolver = "3"
members = [
    "lizhisim",
    "lizhisim-core",
]

[workspace.package]
description = "A Japanese (Riichi) mahjong game simulator."
version = "0.1.0"
authors = ["Apricot S."]
edition = "2024"
rust-version = "1.97"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Apricot-S/lizhisim"
keywords = ["mahjong", "riichi"]
categories = ["simulation"]

[workspace.metadata.release]
tag-prefix = ""

[workspace.dependencies]
lizhisim-core = { path = "lizhisim-core", version = "0.1.0" }

thiserror = "2.0.20"
